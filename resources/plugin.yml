name: AdvancedManhunt
main: org.greenem.plugins.manhunt.main.Main
version: 1.6.1
api-version: 1.16
commands:
   mhhunter:
      description: Turning the player role to the hunter
      default: true
   mhspeedrunner:
      description: Turning the player role to the speedrunner
      default: true
   mhnorole:
      description: No role (not a speedrunner or a hunter)
      default: true
   mhstart:
      description: Start Manhunt
      default: true
   mhproblems:
      description: Special commands
      default: true
   gm:
      description: A shorter gamemode command
      permission: op
   heal:
      description: Heal (yourself or others)
      permission: op
   mhreloadconfig:
      description: Reload the plugin config
      permission: op
   resetworld:
      description: DELETES THE WORLD AND RESTARTS THE SERVER, may be moved to a separate plugin later
      permission: op
   mhw-about:
      description: Display info about the plugin and it's authors
      permission: op